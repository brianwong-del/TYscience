<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>川御打卡系統</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="川御打卡">
    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/brianwong-del/TYscience/main/川御打卡.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/brianwong-del/TYscience/main/川御打卡.png">

    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #f4f6f9; margin: 0; padding: 10px; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 450px; margin: 0 auto; }
        .login-box { background: #eef2f3; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input[type="text"], input[type="password"], input[type="date"], input[type="time"], input[type="month"] { 
            width: 100%; padding: 12px; margin: 5px 0 10px 0; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; 
        }
        .checkbox-container { display: flex; align-items: center; font-size: 16px; color: #555; }
        .checkbox-container input { width: 20px; height: 20px; margin-right: 10px; }
        
        /* 導覽列稍微縮小一點點字體以容納 4 個 Tab */
        .tab-nav { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { flex: 1; margin: 0 2px; padding: 10px 2px; font-size: 15px; font-weight: bold; border-radius: 8px; border: none; background: #eee; color: #555; cursor: pointer; }
        .tab-btn.active { background: #4CAF50; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .btn-main { width: 100%; padding: 15px; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        .btn-green { background-color: #4CAF50; }
        .btn-blue { background-color: #007bff; }
        .btn-orange { background-color: #ff9800; }
        .btn-purple { background-color: #9c27b0; }
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 15px; font-size: 18px; font-weight: bold; }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 16px; }
        th, td { border: 1px solid #ddd; padding: 10px 5px; text-align: center; }
        th { background-color: #f2f2f2; color: #333; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .form-group { text-align: left; font-size: 16px; font-weight: bold; color: #444; }
        /* 📅 月曆專用樣式 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 20px; font-weight: bold; }
        .calendar-btn { background: #eee; border: none; padding: 10px 15px; font-size: 18px; border-radius: 8px; cursor: pointer; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 15px; }
        .cal-head { font-weight: bold; color: #555; background: #f2f2f2; padding: 8px 0; border-radius: 5px; }
        .cal-day { background: #fff; border: 1px solid #ddd; padding: 15px 0; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; position: relative; }
        .cal-day:active { background: #e0e0e0; }
        .cal-day.empty { background: transparent; border: none; cursor: default; }
        
        /* 更份顏色標記 */
        .shift-badge { display: block; font-size: 12px; margin-top: 5px; border-radius: 4px; padding: 2px 0; color: white; }
        .shift-morning { background-color: #ffb300; } /* 早更黃 */
        .shift-night { background-color: #1e88e5; }   /* 夜更藍 */
        .shift-full { background-color: #43a047; }    /* 全日綠 */
        .shift-rest { background-color: #e53935; }    /* 休息紅 */

        /* 彈出視窗 (Modal) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #333; }
        .shift-btn { width: 100%; padding: 15px; margin-bottom: 10px; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn-cancel { background-color: #757575; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部：共用帳號密碼 -->
        <div class="login-box">
            <input type="text" id="empId" placeholder="輸入員工 ID">
            <input type="password" id="empPwd" placeholder="輸入密碼">
            <div class="checkbox-container">
                <input type="checkbox" id="rememberMe" checked>
                <label for="rememberMe">記住帳號密碼</label>
            </div>
        </div>

        <!-- 💡 新增了第四個 Tab：排班 -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('tab-checkin', this)">📍 打卡</button>
            <button class="tab-btn" onclick="switchTab('tab-correction', this)">📝 補卡</button>
            <button class="tab-btn" onclick="switchTab('tab-records', this)">📅 紀錄</button>
            <button class="tab-btn" onclick="switchTab('tab-roster', this)">🗓️ 排班</button>
        </div>

        <!-- 現場打卡 -->
        <div id="tab-checkin" class="tab-content active">
            <button id="btnCheckIn" class="btn-main btn-green" onclick="getLocation()">立即打卡</button>
            <p id="msg-checkin" class="msg"></p>
        </div>

        <!-- 忘記補卡 -->
        <div id="tab-correction" class="tab-content">
            <div class="form-group"><label>日期：</label><input type="date" id="corrDate"></div>
            <div class="form-group"><label>時間：</label><input type="time" id="corrTime"></div>
            <div class="form-group"><label>理由：</label><input type="text" id="corrReason" placeholder="例如：忘記帶手機"></div>
            <button id="btnCorrection" class="btn-main btn-blue" onclick="submitCorrection()">送出補卡</button>
            <p id="msg-correction" class="msg"></p>
        </div>

        <!-- 查詢紀錄 -->
        <div id="tab-records" class="tab-content">
            <div class="form-group"><label>選擇月份：</label><input type="month" id="recordMonth"></div>
            <button id="btnRecords" class="btn-main btn-orange" onclick="fetchRecords()">查詢紀錄</button>
            <p id="msg-records" class="msg"></p>
            
            <div id="monthlyTotal" style="display:none; font-size: 20px; font-weight: bold; color: #d32f2f; margin: 15px 0; background: #ffebee; padding: 10px; border-radius: 8px;"></div>
            
            <table id="recordTable" style="display:none;">
                <thead><tr><th>日期</th><th>實際<br>(上/下)</th><th>計糧<br>(上/下)</th><th>工時</th></tr></thead>
                <tbody id="recordBody"></tbody>
            </table>
            
            <hr style="margin: 25px 0 15px 0; border: 1px dashed #ccc;">
            <button id="btnCheck468" class="btn-main" onclick="check468()" style="background-color: #607d8b; color: white;">🔍 查詢過去 4 週進度</button>
            <div id="msg-468" style="display:none; font-size: 18px; font-weight: bold; margin-top: 15px; padding: 15px; border-radius: 8px; white-space: pre-line;"></div>
        </div>

        <!-- 🗓️ 全新：長輩友善版排班分頁 -->
        <div id="tab-roster" class="tab-content">
            <!-- 報更與查看切換 -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="btnModeSubmit" class="btn-main" style="margin:0; background:#9c27b0; font-size:16px;" onclick="enableSubmitMode()">📝 我要報更</button>
                <button id="btnModeView" class="btn-main" style="margin:0; background:#17a2b8; font-size:16px;" onclick="fetchFinalRoster()">👁️ 查看最終更表</button>
            </div>
            <div class="calendar-header">
                <button class="calendar-btn" onclick="changeMonth(-1)">◀</button>
                <span id="currentMonthLabel">2026年 11月</span>
                <button class="calendar-btn" onclick="changeMonth(1)">▶</button>
            </div>
            
            <div class="calendar-grid" id="calendarGrid">
                <!-- 月曆會透過 JavaScript 自動生成在這裡 -->
            </div>
            
            <button id="btnSubmitRoster" class="btn-main btn-purple" onclick="submitMyRoster()">📤 提交本月更表給行政</button>
            <p id="msg-roster" class="msg"></p>
        </div>

        <!-- 彈出視窗：原生時間輪盤選擇器 -->
        <div id="shiftModal" class="modal-overlay">
            <div class="modal-box">
                <div id="modalDateTitle" class="modal-title">11月2日</div>
                <input type="hidden" id="modalSelectedDate">
                
                <!-- 時間選擇區 -->
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="font-size: 18px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">返工時間：</label>
                    <input type="time" id="startTimeInput" style="width: 100%; padding: 12px; font-size: 22px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px; box-sizing: border-box; text-align: center;">
                    
                    <label style="font-size: 18px; font-weight: bold; color: #555; display: block; margin-bottom: 5px;">放工時間：</label>
                    <input type="time" id="endTimeInput" style="width: 100%; padding: 12px; font-size: 22px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; text-align: center;">
                </div>

                <!-- 確認與清除按鈕 -->
                <button class="shift-btn" style="background-color: #4CAF50;" onclick="saveTimeShift()">✅ 確認時間</button>
                <button class="shift-btn shift-rest" onclick="setShift('休')">❌ 休息 (清除)</button>
                
                <button class="shift-btn btn-cancel" onclick="closeModal()">返回</button>
            </div>
        </div>

    </div>

    <script>
        // 🚨 這裡填入你 Google Apps Script 部署出來的 /exec 網址
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwh-3xa7mt998WmGcaek6K3aMDlPm2r9calcXwqS-CjGjXB_6jxZPrLFd3VrM6DG9dS2w/exec";

        window.onload = function() {
            if (localStorage.getItem("empId")) {
                document.getElementById("empId").value = localStorage.getItem("empId");
                document.getElementById("empPwd").value = localStorage.getItem("empPwd");
            }
            let today = new Date();
            document.getElementById("corrDate").value = today.toISOString().split('T')[0];
            let yyyy_mm = today.getFullYear() + "-" + ("0" + (today.getMonth() + 1)).slice(-2);
            document.getElementById("recordMonth").value = yyyy_mm;
            document.getElementById("rosterMonth").value = yyyy_mm; // 排班月份預設為當月
        };

        function getDeviceId() {
            let deviceId = localStorage.getItem("deviceId");
            if (!deviceId) {
                deviceId = "DEV_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                localStorage.setItem("deviceId", deviceId);
            }
            return deviceId;
        }

        function switchTab(tabId, btnElement) {
            let contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].classList.remove("active");
            let btns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < btns.length; i++) btns[i].classList.remove("active");
            document.getElementById(tabId).classList.add("active");
            btnElement.classList.add("active");
        }

        function getCredentials() {
            let id = document.getElementById("empId").value;
            let pwd = document.getElementById("empPwd").value;
            if (!id || !pwd) return null;
            if (document.getElementById("rememberMe").checked) {
                localStorage.setItem("empId", id);
                localStorage.setItem("empPwd", pwd);
            }
            return {id: id, pwd: pwd};
        }

        function callGAS(payload, successCallback, errorCallback) {
            fetch(GAS_API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => successCallback(data))
            .catch(err => {
                console.error("API Error:", err);
                errorCallback(err);
            });
        }

        // 打卡
        function getLocation() {
            let cred = getCredentials();
            let msg = document.getElementById("msg-checkin");
            let btn = document.getElementById("btnCheckIn");
            if (!cred) { msg.className = "msg error"; msg.innerText = "❌ 請先輸入帳號與密碼！"; return; }
            
            btn.disabled = true; btn.innerText = "定位中..."; msg.innerText = "⏳ 正在取得位置..."; msg.className = "msg";

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    msg.innerText = "⏳ 驗證中...";
                    let payload = { action: "checkIn", id: cred.id, pwd: cred.pwd, lat: position.coords.latitude, lng: position.coords.longitude, deviceId: getDeviceId() };
                    
                    callGAS(payload, 
                        function(res) {
                            msg.innerText = res.msg;
                            msg.className = res.status === 'success' ? 'msg success' : 'msg error';
                            btn.disabled = false; btn.innerText = "立即打卡";
                        }, 
                        function(err) {
                            msg.className = "msg error"; msg.innerText = "❌ 系統錯誤。";
                            btn.disabled = false; btn.innerText = "立即打卡";
                        }
                    );
                },
                function(error) {
                    msg.className = "msg error"; msg.innerText = "❌ 無法取得位置，請確認允許 GPS。";
                    btn.disabled = false; btn.innerText = "立即打卡";
                }, { enableHighAccuracy: true, timeout: 15000 }
            );
        }

        // 補卡
        function submitCorrection() {
            let cred = getCredentials();
            let msg = document.getElementById("msg-correction");
            let btn = document.getElementById("btnCorrection");
            let date = document.getElementById("corrDate").value;
            let time = document.getElementById("corrTime").value;
            let reason = document.getElementById("corrReason").value || "無";

            if (!cred) { msg.className = "msg error"; msg.innerText = "❌ 請先輸入帳號密碼！"; return; }
            if (!date || !time) { msg.className = "msg error"; msg.innerText = "❌ 請選擇日期與時間！"; return; }

            btn.disabled = true; btn.innerText = "傳送中..."; msg.innerText = "⏳ 處理中..."; msg.className = "msg";

            let payload = { action: "correction", id: cred.id, pwd: cred.pwd, date: date, time: time, reason: reason };
            
            callGAS(payload, 
                function(res) {
                    msg.innerText = res.msg;
                    msg.className = res.status === 'success' ? 'msg success' : 'msg error';
                    btn.disabled = false; btn.innerText = "送出補卡";
                }, 
                function(err) {
                    msg.className = "msg error"; msg.innerText = "❌ 系統錯誤。";
                    btn.disabled = false; btn.innerText = "送出補卡";
                }
            );
        }

        // 查詢紀錄
        function fetchRecords() {
            let cred = getCredentials();
            let msg = document.getElementById("msg-records");
            let btn = document.getElementById("btnRecords");
            let month = document.getElementById("recordMonth").value;
            let table = document.getElementById("recordTable");
            let tbody = document.getElementById("recordBody");
            let totalDiv = document.getElementById("monthlyTotal");

            if (!cred) { msg.className = "msg error"; msg.innerText = "❌ 請先輸入帳號密碼！"; return; }
            if (!month) { msg.className = "msg error"; msg.innerText = "❌ 請選擇月份！"; return; }

            btn.disabled = true; btn.innerText = "查詢中..."; msg.innerText = "";
            table.style.display = "none"; tbody.innerHTML = "";
            totalDiv.style.display = "none"; 

            let payload = { action: "getRecords", id: cred.id, pwd: cred.pwd, yearMonth: month };

            callGAS(payload, 
                function(res) {
                    btn.disabled = false; btn.innerText = "查詢紀錄";
                    if (res.status === "error") { msg.className = "msg error"; msg.innerText = res.msg; return; }
                    if (res.data.length === 0) { msg.className = "msg error"; msg.innerText = "⚠️ 這個月無紀錄！"; return; }

                    res.data.forEach(function(row) {
                        let tr = document.createElement("tr");
                        tr.innerHTML = `<td>${row.date}</td>
                                        <td><span style="color:#888;">${row.actualIn}</span><br><span style="color:#888;">${row.actualOut}</span></td>
                                        <td><strong>${row.payIn}</strong><br><strong>${row.payOut}</strong></td>
                                        <td><strong>${row.hours}</strong></td>`;
                        tbody.appendChild(tr);
                    });
                    table.style.display = "table";
                    
                    totalDiv.innerHTML = `💰 當月計糧總工時：<br><span style="font-size: 26px;">${res.totalHours} 小時</span>`;
                    totalDiv.style.display = "block";
                },
                function(err) {
                    btn.disabled = false; btn.innerText = "查詢紀錄";
                    msg.className = "msg error"; msg.innerText = "❌ 異常: " + err;
                }
            );
        }

        // 468 查詢
        function check468() {
            let cred = getCredentials();
            let msgBox = document.getElementById("msg-468");
            let btn = document.getElementById("btnCheck468");

            if (!cred) { 
                msgBox.style.display = "block"; msgBox.style.background = "#ffebee"; msgBox.style.color = "#d32f2f";
                msgBox.innerText = "❌ 請先輸入上方帳號密碼！"; return; 
            }

            btn.disabled = true; btn.innerText = "計算中..."; 
            msgBox.style.display = "block"; msgBox.style.background = "#eef2f3"; msgBox.style.color = "#555";
            msgBox.innerText = "⏳ 正在回溯過去 28 天打卡紀錄...";

            let payload = { action: "check468", id: cred.id, pwd: cred.pwd };

            callGAS(payload, 
                function(res) {
                    btn.disabled = false; btn.innerText = "🔍 查詢過去 4 週進度";
                    if (res.status === "error") { 
                        msgBox.style.background = "#ffebee"; msgBox.style.color = "#d32f2f"; msgBox.innerText = res.msg; 
                    } else {
                        msgBox.style.background = res.hours >= 68 ? "#e2efda" : "#fff2cc";
                        msgBox.style.color = res.hours >= 68 ? "#2e7d32" : "#e65100";
                        msgBox.innerText = res.msg;
                    }
                },
                function(err) {
                    btn.disabled = false; btn.innerText = "🔍 查詢過去 4 週進度";
                    msgBox.style.background = "#ffebee"; msgBox.style.color = "#d32f2f"; msgBox.innerText = "❌ 異常: " + err;
                }
            );
        }

        // 💡 查詢個人更表 (新增的函數)
        function fetchRoster() {
            let cred = getCredentials();
            let msg = document.getElementById("msg-roster");
            let btn = document.getElementById("btnRoster");
            let month = document.getElementById("rosterMonth").value;
            let table = document.getElementById("rosterTable");
            let tbody = document.getElementById("rosterBody");

            if (!cred) { msg.className = "msg error"; msg.innerText = "❌ 請先輸入帳號密碼！"; return; }
            if (!month) { msg.className = "msg error"; msg.innerText = "❌ 請選擇月份！"; return; }

            btn.disabled = true; btn.innerText = "讀取中..."; msg.innerText = "";
            table.style.display = "none"; tbody.innerHTML = "";

            let payload = { action: "getRoster", id: cred.id, pwd: cred.pwd, yearMonth: month };

            callGAS(payload, 
                function(res) {
                    btn.disabled = false; btn.innerText = "查看我的更表";
                    if (res.status === "error") { msg.className = "msg error"; msg.innerText = res.msg; return; }
                    if (res.data.length === 0) { msg.className = "msg error"; msg.innerText = "⚠️ 這個月尚未發布排班！"; return; }

                    res.data.forEach(function(row) {
                        let tr = document.createElement("tr");
                        // 如果是休息日，可以加上顏色區分
                        let colorStyle = row.shift === "休" ? "color: #d32f2f;" : "color: #2e7d32; font-weight: bold;";
                        tr.innerHTML = `<td>${row.date}</td><td style="${colorStyle}">${row.shift}</td>`;
                        tbody.appendChild(tr);
                    });
                    table.style.display = "table";
                },
                function(err) {
                    btn.disabled = false; btn.innerText = "查看我的更表";
                    msg.className = "msg error"; msg.innerText = "❌ 異常: " + err;
                }
            );
        }
        // 📅 月曆系統邏輯
        let currentCalDate = new Date();
        // 用來儲存員工點選的排班草稿：格式如 {"2026-11-05": "早更", "2026-11-06": "休"}
        let monthlyDraft = {}; 

        // 當切換到「排班」Tab 時，渲染月曆
        function initCalendar() {
            renderCalendar(currentCalDate.getFullYear(), currentCalDate.getMonth());
        }

        function changeMonth(offset) {
            currentCalDate.setMonth(currentCalDate.getMonth() + offset);
            renderCalendar(currentCalDate.getFullYear(), currentCalDate.getMonth());
        }

        function renderCalendar(year, month) {
            let grid = document.getElementById("calendarGrid");
            document.getElementById("currentMonthLabel").innerText = `${year}年 ${month + 1}月`;
            grid.innerHTML = "";

            const daysOfWeek = ["日", "一", "二", "三", "四", "五", "六"];
            daysOfWeek.forEach(day => {
                grid.innerHTML += `<div class="cal-head">${day}</div>`;
            });

            let firstDay = new Date(year, month, 1).getDay();
            let daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="cal-day empty"></div>`;
            }

            for (let i = 1; i <= daysInMonth; i++) {
                let dateStr = `${year}-${("0" + (month + 1)).slice(-2)}-${("0" + i).slice(-2)}`;
                let shiftVal = monthlyDraft[dateStr] || ""; 
                
                let badgeHtml = "";
                if (shiftVal) {
                    // 如果是休息標紅，有時間則標藍
                    let badgeClass = shiftVal === "休" ? "shift-badge shift-rest" : "shift-badge shift-night";
                    // 如果是時間格式，稍微縮小字體以適應格子
                    let displayVal = shiftVal === "休" ? "休" : `<span style="font-size:10px;">${shiftVal}</span>`;
                    badgeHtml = `<span class="${badgeClass}">${displayVal}</span>`;
                }

                grid.innerHTML += `
                    <div class="cal-day" onclick="openShiftModal('${dateStr}', ${i})">
                        ${i}
                        ${badgeHtml}
                    </div>`;
            }
        }

        
        // 打開彈出視窗時，載入原生時間或預設時間
        function openShiftModal(dateStr, dayIndex) {
            // 🛡️ 唯讀模式攔截：如果是在查看最終更表，不准修改
            if (isReadOnly) {
                alert("🔒 目前為「查看最終更表」模式，無法自行修改時間。\n\n如對更表有疑問或需請假，請聯絡行政同事！");
                return;
            }

            document.getElementById("modalDateTitle").innerText = `${currentCalDate.getMonth() + 1}月${dayIndex}日`;
            document.getElementById("modalSelectedDate").value = dateStr;
            
            let existingShift = monthlyDraft[dateStr] || "";
            let startInput = document.getElementById("startTimeInput");
            let endInput = document.getElementById("endTimeInput");

            if (existingShift && existingShift !== "休" && existingShift.includes("-")) {
                let times = existingShift.split("-");
                startInput.value = times[0].trim();
                endInput.value = times[1].trim();
            } else {
                startInput.value = "09:00";
                endInput.value = "18:00";
            }
            
            document.getElementById("shiftModal").style.display = "flex";
        }
        // 讀取輪盤上的時間並儲存
        function saveTimeShift() {
            let startTime = document.getElementById("startTimeInput").value;
            let endTime = document.getElementById("endTimeInput").value;
            
            if (!startTime || !endTime) {
                alert("請完整選擇「返工」與「放工」時間！");
                return;
            }
            
            let shiftStr = `${startTime}-${endTime}`;
            setShift(shiftStr);
        }
        // 關閉視窗
        function closeModal() {
            document.getElementById("shiftModal").style.display = "none";
        }

        // 點擊大按鈕設定更份
        function setShift(shiftVal) {
            let dateStr = document.getElementById("modalSelectedDate").value;
            monthlyDraft[dateStr] = shiftVal; // 直接記錄，把 "休" 也寫進去
            closeModal();
            renderCalendar(currentCalDate.getFullYear(), currentCalDate.getMonth()); 
        }

        // 手動輸入自訂時間
        function setCustomShift() {
            let customVal = document.getElementById("customShiftInput").value.trim();
            if (customVal !== "") {
                setShift(customVal);
            }
        }

        // 為了讓排班 Tab 一點擊就載入月曆，我們稍微修改原來的 switchTab
        const originalSwitchTab = switchTab;
        switchTab = function(tabId, btnElement) {
            originalSwitchTab(tabId, btnElement);
            if (tabId === 'tab-roster') {
                initCalendar(); // 啟動月曆
            }
        };

        // 將選好的整個月更表送出給 Google Apps Script 後台
        function submitMyRoster() {
            let cred = getCredentials();
            let msg = document.getElementById("msg-roster");
            let btn = document.getElementById("btnSubmitRoster");

            if (!cred) { msg.className = "msg error"; msg.innerText = "❌ 請先輸入上方帳號密碼！"; return; }
            if (Object.keys(monthlyDraft).length === 0) { msg.className = "msg error"; msg.innerText = "⚠️ 你還沒有填寫任何更份喔！"; return; }

            let yearMonthStr = `${currentCalDate.getFullYear()}-${("0" + (currentCalDate.getMonth() + 1)).slice(-2)}`;

            btn.disabled = true; btn.innerText = "📤 傳送中..."; msg.innerText = "⏳ 正在提交給行政..."; msg.className = "msg";

            let payload = { 
                action: "submitRoster", 
                id: cred.id, 
                pwd: cred.pwd, 
                yearMonth: yearMonthStr, 
                shifts: monthlyDraft // 把整個月的點選結果打包送出
            };

            callGAS(payload, 
                function(res) {
                    msg.innerText = res.msg;
                    msg.className = res.status === 'success' ? 'msg success' : 'msg error';
                    btn.disabled = false; btn.innerText = "📤 提交本月更表給行政";
                }, 
                function(err) {
                    msg.className = "msg error"; msg.innerText = "❌ 系統錯誤，請聯絡管理員。";
                    btn.disabled = false; btn.innerText = "📤 提交本月更表給行政";
                }
            );
        }
        let isReadOnly = false; // 記錄目前是否為唯讀模式

        // 啟動報更模式
        function enableSubmitMode() {
            isReadOnly = false;
            document.getElementById("btnSubmitRoster").style.display = "block"; // 顯示提交按鈕
            document.getElementById("btnModeSubmit").style.opacity = "1";
            document.getElementById("btnModeView").style.opacity = "0.5";
            monthlyDraft = {}; // 清空畫面，讓員工自己填
            renderCalendar(currentCalDate.getFullYear(), currentCalDate.getMonth());
            document.getElementById("msg-roster").innerText = "💡 提示：點擊下方日子開始報更";
            document.getElementById("msg-roster").className = "msg";
        }

        // 啟動查看最終更表模式
        function fetchFinalRoster() {
            let cred = getCredentials();
            let msg = document.getElementById("msg-roster");
            if (!cred) { msg.className = "msg error"; msg.innerText = "❌ 請先輸入上方帳號密碼！"; return; }

            let yearMonthStr = `${currentCalDate.getFullYear()}-${("0" + (currentCalDate.getMonth() + 1)).slice(-2)}`;
            msg.className = "msg"; msg.innerText = "⏳ 正在下載最新更表...";

            let payload = { action: "getRoster", id: cred.id, pwd: cred.pwd, yearMonth: yearMonthStr };

            callGAS(payload, 
                function(res) {
                    if (res.status === "error") { msg.className = "msg error"; msg.innerText = res.msg; return; }
                    
                    // 成功抓取資料，進入唯讀模式
                    isReadOnly = true;
                    document.getElementById("btnSubmitRoster").style.display = "none"; // 隱藏提交按鈕
                    document.getElementById("btnModeSubmit").style.opacity = "0.5";
                    document.getElementById("btnModeView").style.opacity = "1";
                    
                    // 把後台資料畫上月曆
                    monthlyDraft = {};
                    res.data.forEach(function(item) {
                        if (item.shift !== "") {
                            monthlyDraft[item.date] = item.shift;
                        }
                    });
                    
                    renderCalendar(currentCalDate.getFullYear(), currentCalDate.getMonth());
                    msg.className = "msg success"; 
                    msg.innerText = "✅ 這是行政批核後的最新更表！(唯讀模式)";
                },
                function(err) {
                    msg.className = "msg error"; msg.innerText = "❌ 系統錯誤: " + err;
                }
            );
        }

        // 🛡️ 修改 openShiftModal，攔截唯讀模式下的點擊
        const originalOpenShiftModal = openShiftModal;
        openShiftModal = function(dateStr, dayIndex) {
            if (isReadOnly) {
                alert("🔒 目前為「查看最終更表」模式，無法自行修改時間。\n\n如對更表有疑問或需請假，請聯絡行政同事！");
                return;
            }
            originalOpenShiftModal(dateStr, dayIndex); // 如果不是唯讀，就正常打開輪盤
        };
    </script>
</body>
</html>
